<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>东京湾街区 · 芝公园</title><link rel="icon" href="data:,">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1e2934}#district-scene{width:100%;height:100%;display:block;touch-action:none}/*GAME_STYLE*/</style></head>
<body><canvas id="district-scene" aria-label="芝公园游戏场景"></canvas>
<section id="loader" aria-label="正在进入东京湾街区" aria-busy="true">
      <img class="load-art" src="SHIBA_ART" alt="" fetchpriority="high">
      <div class="load-layout">
        <header class="load-header">
          <div class="load-brand"><i aria-hidden="true"></i><strong lang="en">TOKYO BAY</strong><span>东京湾街区</span></div>
          <div class="load-region"><i aria-hidden="true"></i>东京都<span>/</span>港区</div>
        </header>
        <div class="load-place">
          <h1 lang="en"><span>SHIBA</span><span>PARK</span></h1>
          <p><span>芝公园</span><i aria-hidden="true"></i>东京塔</p>
        </div>
        <footer class="load-bottom">
          <div class="load-tips" aria-label="游戏操作">
            <span class="mouse-tip"><kbd>WASD</kbd>移动</span>
            <span class="mouse-tip"><kbd>E</kbd>交谈</span>
            <span class="mouse-tip"><kbd>G</kbd>车库</span>
            <span class="touch-tip"><kbd>方向键</kbd>步行</span>
            <span class="touch-tip"><kbd>拖动</kbd>环视</span>
          </div>
          <div class="load-status">
            <div class="load-status-row"><span class="step" role="status">读取本地地图</span><span class="load-value" aria-hidden="true"><b>0</b><small>%</small></span></div>
            <div class="load-bar" role="progressbar" aria-label="地图加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i class="fill"></i></div>
            <button class="load-retry" type="button" hidden onclick="location.reload()">重新载入</button>
          </div>
        </footer>
      </div>
    </section>
<!--GAME_HUD-->
<!--GAME_DATA-->
</body></html>
